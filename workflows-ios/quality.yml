name: Code Quality

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

# ============================================================================
# BILLING OPTIMIZATION
# ============================================================================
# This workflow is optimized for GitHub Actions billing:
# - ubuntu-latest: 1x multiplier (standard rate)
# - macos-15: 10x multiplier (use only when Xcode is required)
#
# SwiftLint and SwiftFormat run on Ubuntu to minimize costs.
# For private repos with 2,000 min/month free tier, this saves ~90% on
# quality checks compared to running on macOS.
# ============================================================================

# ============================================================================
# TOOL VERSION PINNING
# ============================================================================
# SwiftLint and SwiftFormat are installed at the EXACT versions pinned in
# `.arc-tool-versions` (copied from ARCDevTools/configs/tool-versions by
# `arcdevtools-setup`).
#
# Do NOT reintroduce `norio-nomura/action-swiftlint`: its version tag pins the
# action, not SwiftLint — the image behind it (`norionomura/swiftlint:swift-5`)
# is a moving tag, so the linter version silently changed underneath PRs and
# broke builds that were green the day before. Same reason `brew install
# swiftlint` is banned: no versioned formula, always latest.
#
# Git hooks and `make lint` resolve the same pins via
# ARCDevTools/scripts/tool-env.sh, so local == CI.
# ============================================================================

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned tool versions
        id: versions
        # Falls back to the submodule copy when a project has not re-run
        # arcdevtools-setup yet (so .arc-tool-versions is not committed).
        run: |
          PINS=.arc-tool-versions
          [ -f "$PINS" ] || PINS=ARCDevTools/configs/tool-versions
          grep -E '^[A-Z_]+=' "$PINS" >> "$GITHUB_OUTPUT"

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .arc-tools
          key: arc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.arc-tool-versions', 'ARCDevTools/configs/tool-versions') }}

      # Installs the statically linked Linux build — no Swift toolchain needed.
      - name: Install pinned SwiftLint
        run: ./ARCDevTools/scripts/install-tools.sh swiftlint

      - name: Run SwiftLint (${{ steps.versions.outputs.SWIFTLINT_VERSION }})
        run: .arc-tools/bin/swiftlint lint --strict

  swiftformat:
    name: SwiftFormat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned tool versions
        id: versions
        # Falls back to the submodule copy when a project has not re-run
        # arcdevtools-setup yet (so .arc-tool-versions is not committed).
        run: |
          PINS=.arc-tool-versions
          [ -f "$PINS" ] || PINS=ARCDevTools/configs/tool-versions
          grep -E '^[A-Z_]+=' "$PINS" >> "$GITHUB_OUTPUT"

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .arc-tools
          key: arc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.arc-tool-versions', 'ARCDevTools/configs/tool-versions') }}

      - name: Install pinned SwiftFormat
        run: ./ARCDevTools/scripts/install-tools.sh swiftformat

      - name: Check formatting (${{ steps.versions.outputs.SWIFTFORMAT_VERSION }})
        run: .arc-tools/bin/swiftformat --config .swiftformat --lint .

  markdown-links:
    name: Validate Markdown Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/markdown-link-check-config.json'
          check-modified-files-only: 'no'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
